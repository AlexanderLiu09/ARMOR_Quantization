defaults:
  - _self_
  - ./@compression_config.naive_compression_config: prune
  # - override compression_config.naive_compression_config.compression_config.normalizer_kwargs.norm_order: []

init_config:
  _target_: "src.ARMOR_compress.ARMOR_Linear"
  verbose: False

compression_config:
  block_diagonal_config:
    block_size: 32
    importance_weight: "hessianDiag"


  W_optimizer_config:
    _target_: "torch.optim.Adam"
    lr: 5e-6   # was 0.0001 -- starting lr for cosine must be ≤ known-safe value
    # weight_decay: 0.001
  
  AB_optimizer_config:
    _target_: "torch.optim.Adam"
    lr: 0.0001

  lr_scheduler_config:
    _target_: "torch.optim.lr_scheduler.CosineAnnealingLR"
    T_max: ${..training_config.n_iters}
    eta_min: 1.0e-6

  training_config:
    _target_: "src.ARMOR_compress.TrainingConfig"
    n_iters: 3000
    n_W_updates_per_iter: 1
    n_AB_updates_per_iter: 1
    n_sparse_core_updates_per_iter: 1
    sparse_core_step_select: "gradient_all_random"
    loss_atol: 1e-8
    loss_rtol: 1e-6
    overall_patience: 200
    log_freq: 100
    # logging_path: "/data/lliu/PermPrune/test/permute.txt"
    # plotting_path: "/data/lliu/PermPrune/test/permute.png"
    # save_path: "/data/lliu/PermPrune/test/permute_{iter}.pt"
    # save_freq: 1000 

  normalizer_kwargs:
    norm_order: [0, 1]
    zero: [False, False]
    p: 2



